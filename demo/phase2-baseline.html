<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 2 — Baseline Inference</title>
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "onnxruntime-web": "/node_modules/onnxruntime-web/dist/ort.wasm.min.mjs",
  "adaptive-onnx-loader": "/packages/adaptive-onnx-loader/src/index.js"
} }
</script>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#2563eb; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --card:#292524; --line:#44403c; --accent:#60a5fa; --ok:#4ade80; --bad:#f87171; } }
  body { font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 24px 16px; }
  main { max-width: 820px; margin: auto; }
  h1 { font-size: 22px; margin: 0 0 4px } p.sub { color: var(--muted); margin: 0 0 20px }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label, select, button, input { font: inherit; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1; min-width: 200px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; max-height: 360px; font-size: 13px; }
  .badge { font-weight: 600 } .ok { color: var(--ok) } .bad { color: var(--bad) }
</style>
</head>
<body>
<main>
  <h1>Baseline: full model in onnxruntime-web</h1>
  <p class="sub">Phase 2 · DistilBERT-SST2, one InferenceSession, WASM backend.
     Cross-origin isolated: <span id="coi" class="badge"></span></p>

  <section>
    <div class="row">
      <label>Precision <select id="prec"><option>int8</option><option>fp32</option></select></label>
      <label>Threads <select id="thr"><option>1</option><option>2</option><option selected>4</option></select></label> <small id="thrNote"></small>
      <label><input type="checkbox" id="ua"> Measure page memory (slow)</label>
      <button id="load">Load model</button>
      <span id="loadInfo"></span>
    </div>
  </section>

  <section>
    <div class="row">
      <input id="text" type="text" value="a gorgeous, witty, seductive movie.">
      <button id="classify" disabled>Classify</button>
    </div>
    <p id="pred"></p>
  </section>

  <section>
    <div class="row"><button id="bench" disabled>Run SST-2 validation (872 sentences)</button> <button id="copy" disabled>Copy results</button> <span id="progress"></span></div>
    <pre id="out">Results appear here.</pre>
  </section>
</main>
<script type="module" src="./phase2-baseline.js"></script>
</body>
</html>
