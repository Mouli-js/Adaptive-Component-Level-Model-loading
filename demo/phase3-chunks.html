<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 3 — Chunked Execution</title><link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "onnxruntime-web": "/node_modules/onnxruntime-web/dist/ort.wasm.min.mjs",
  "adaptive-onnx-loader": "/packages/adaptive-onnx-loader/src/index.js"
} }
</script>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#2563eb; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --card:#292524; --line:#44403c; --accent:#60a5fa; --ok:#4ade80; --bad:#f87171; } }
  body { font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 24px 16px; }
  main { max-width: 860px; margin: auto; } h1 { font-size: 22px; margin: 0 0 4px } p.sub { color: var(--muted); margin: 0 0 20px }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } label, select, button { font: inherit; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; } button:disabled { opacity: .5 }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; max-height: 420px; font-size: 12px; }
  .ok { color: var(--ok); font-weight: 600 } .bad { color: var(--bad); font-weight: 600 }
</style>
</head>
<body><main>
  <h1>Chunked execution: 4 sessions, 1 Worker per chunk</h1>
  <p class="sub">Phase 3 · Cross-origin isolated: <span id="coi"></span> · Reload the page between experiments for clean memory numbers.</p>
  <section>
    <div class="row">
      <label>Precision <select id="prec"><option>int8</option><option>fp32</option></select></label>
      <label>Sentences <select id="lim"><option value="872">all 872</option><option value="100">100</option></select></label>
      <label>Threads per Worker <select id="thr"><option>1</option><option>2</option><option>4</option></select></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button data-exp="mainChain">A · Main-thread chain</button>
      <button data-exp="resident">B · Workers: resident</button>
      <button data-exp="sequential">C · Workers: sequential</button>
      <button data-exp="memoryProof">D · Memory-release proof (slow)</button>
      <button data-exp="baseOverhead">E · ORT base overhead</button>
    </div>
    <p id="st"></p>
  </section>
  <section><div class="row"><button id="copy" disabled>Copy results</button></div><pre id="out">Results appear here.</pre></section>
</main>
<script type="module" src="./phase3-chunks.js"></script>
</body></html>
